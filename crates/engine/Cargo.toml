[package]
name = "proton-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust sync engine for Proton Drive for Linux."

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
fs2 = "0.4.3"
glob = "0.3.2"
libc = "0.2"
proton-core = { path = "../core" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.4.2"
zbus = { version = "5.19.0", features = ["blocking-api"] }
