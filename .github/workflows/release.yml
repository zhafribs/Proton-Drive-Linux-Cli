name: Check upstream & release

# Future-proofing: this workflow keeps the repository tracking Proton's CLI.
#
#   schedule        every 6 hours - detects a new upstream release, rewrites
#                   upstream.lock, builds the AppImage and publishes a
#                   GitHub release tagged v<cli>-gui<gui> (one release per
#                   distinct CLI+GUI pair; existing releases stay untouched
#                   and are never pruned)
#   workflow_dispatch  manual run; set force_rebuild to rebuild + re-upload
#                   assets for the current CLI+GUI version
#   push to main    rebuilds whenever the packaging itself changes; a new
#                   GUI_VERSION in the source publishes its own new release
#   pull_request    validation only (build + metadata checks, no publish)
#
# Everything the build needs is data-driven from upstream.lock, which
# scripts/check-upstream.sh refreshes by parsing Proton's download page.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild and re-upload release assets even if they already exist'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - upstream.lock
      - build.sh
      - CHANGELOG.md
      - release-notes.md.tmpl
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - '.cargo/**'
      - 'crates/**'
      - 'src/**'
      - 'scripts/**'
      - 'gui/**'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Read-only. Runs the tests and lint gate on every event, including PRs,
    # before the write-capable release job can start.
    runs-on: ubuntu-24.04
    steps:
      - name: Use main as the default branch name
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin desktop-file-utils appstream binutils openssl \
            libxkbcommon-dev libwayland-dev fonts-dejavu-core \
            mesa-vulkan-drivers libvulkan1 squashfs-tools \
            flatpak flatpak-builder

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy

      - name: Cache the verification build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            gui/target
          key: verify-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            verify-${{ runner.os }}-

      - name: Test
        env:
          PROTON_UI_SCREENSHOTS: ${{ runner.temp }}/ui-screenshots
        run: cargo test --workspace --all-targets

      - name: Keep the UI audit screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-audit-screenshots
          path: ${{ runner.temp }}/ui-screenshots
          if-no-files-found: error
          retention-days: 7

      - name: Check third-party licences are current
        run: |
          command -v cargo-about >/dev/null 2>&1 \
            || cargo install cargo-about --locked --features cli
          ./scripts/gen-licenses.sh
          git diff --exit-code -- src/licenses/proton-drive-gui-THIRD-PARTY.txt

      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings

      - name: Shell syntax and release-gate fixtures
        run: |
          bash -n build.sh scripts/*.sh
          ./scripts/test-check-release.sh

  release:
    needs: verify
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    # Pinned (not ubuntu-latest): GitHub migrates ubuntu-latest to Ubuntu 26 on
    # 2026-10-19, and this job runs unattended every 6h - upgrade deliberately
    # by changing this line, not via a silent label migration.
    runs-on: ubuntu-24.04
    steps:
      - name: Use main as the default branch name
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch release tags for the version-bump gate
        run: git fetch --tags --force

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin desktop-file-utils appstream binutils openssl

      - name: Cache the Rust build (registry + cargo tools + target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            gui/target
          key: rust-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-czb0.24.0
          restore-keys: |
            rust-v2-${{ runner.os }}-

      - name: Cache zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/zig
          key: zig-${{ runner.os }}-0.15.2-02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239

      - name: Cache Flatpak runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-${{ runner.os }}-freedesktop-25.08-v1

      # The GUI is a Rust binary; it cross-builds with cargo-zigbuild so its
      # glibc floor is pinned to 2.28 (Debian 10 era) instead of the runner's
      # own glibc. zig comes from ziglang.org directly: the PyPI ziglang
      # package's launcher is not on cargo-zigbuild's search path.
      - name: Install the Rust toolchain and zig (GUI builds)
        run: |
          rustup toolchain install 1.99.1 --profile minimal \
            --component clippy --target x86_64-unknown-linux-gnu \
            --target aarch64-unknown-linux-gnu
          ZIG_VERSION=0.15.2
          ZIG_SHA256=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
          if [ -x "$HOME/zig/zig" ] && [ "$("$HOME/zig/zig" version 2>/dev/null)" != "$ZIG_VERSION" ]; then
            echo "cached zig is not $ZIG_VERSION; replacing it"
            rm -rf "$HOME/zig"
          fi
          if [ ! -x "$HOME/zig/zig" ]; then
            wget -q "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
                 -O "$RUNNER_TEMP/zig.tar.xz"
            echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
            mkdir -p "$HOME/zig"
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$HOME/zig" --strip-components=1
          fi
          [ "$("$HOME/zig/zig" version)" = "$ZIG_VERSION" ] || {
            echo "zig version mismatch" >&2; exit 1;
          }
          echo "$HOME/zig" >> "$GITHUB_PATH"
          # 0.24.0 contains the fix that drops rustc's deprecated -Wl,-O1
          # before Zig's linker; a stale 0.23.x cached binary would warn.
          CZB_VERSION=0.24.0
          if ! command -v cargo-zigbuild >/dev/null 2>&1 \
             || ! cargo-zigbuild --version 2>/dev/null | grep -q "$CZB_VERSION"; then
            cargo install cargo-zigbuild --version "$CZB_VERSION" --locked --force
          fi

      - name: Cache Proton binaries and build tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            tools
            download
          # The payload is Rust-only (GUI + engine + Rust AppRun + the upstream
          # Rust CLI). No Python/CPython bundle and no desktop wheels any more.
          key: build-v5-${{ runner.os }}-${{ hashFiles('upstream.lock') }}

      - name: Check Proton's download page for a new release
        id: upstream
        run: ./scripts/check-upstream.sh

      - name: Commit the refreshed upstream.lock
        if: steps.upstream.outputs.updated == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream.lock
          git commit -m "chore: bump Proton Drive CLI to ${{ steps.upstream.outputs.version }} [skip ci]"
          git push

      - name: Build AppImages (x86_64 and aarch64)
        env:
          REQUIRE_GLIBC_FLOOR: "1"
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./build.sh all

      # Attestation, not documentation: a second build from the same commit
      # must produce exactly the same AppImage bytes.
      - name: Prove the AppImage is reproducible
        env:
          REQUIRE_GLIBC_FLOOR: "1"
        run: |
          set -euo pipefail
          cp dist/ProtonDrive-CLI-*-x86_64.AppImage "$RUNNER_TEMP/first.AppImage"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./build.sh x86_64
          cmp "$RUNNER_TEMP/first.AppImage" dist/ProtonDrive-CLI-*-x86_64.AppImage
          echo "reproducible: both builds are byte-identical"

      - name: Build .deb packages
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./scripts/build-deb.sh all

      - name: Install the Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build the Flatpak bundle
        run: ./scripts/build-flatpak.sh

      - name: Prove the Flatpak starts
        run: ./scripts/check-flatpak.sh

      - name: Sign the checksum manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: ./scripts/sign-release.sh

      - name: Verify the release gate
        env:
          ALLOW_SAME_VERSION: ${{ inputs.force_rebuild || false }}
        run: ./scripts/check-release.sh

      - name: Generate release notes
        run: ./scripts/release-notes.sh "${{ steps.upstream.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish the GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force_rebuild || false }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          GUI="$(sed -n 's/^pub const GUI_VERSION: &str = "\(.*\)";$/\1/p' gui/src/main.rs | head -1)"
          [ -n "$GUI" ] || { echo "GUI_VERSION missing from gui/src/main.rs" >&2; exit 1; }
          TAG="v${VERSION}-gui${GUI}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          ASSETS=(dist/ProtonDrive-CLI-"${VERSION}"-GUI-"${GUI}"-x86_64.AppImage
                  dist/ProtonDrive-CLI-"${VERSION}"-GUI-"${GUI}"-aarch64.AppImage
                  dist/proton-drive_"${VERSION}"+gui"${GUI}"_amd64.deb
                  dist/proton-drive_"${VERSION}"+gui"${GUI}"_arm64.deb
                  dist/proton-drive_"${VERSION}"+gui"${GUI}"_x86_64.flatpak
                  dist/SHA256SUMS
                  dist/SHA256SUMS.sig
                  dist/revocations.json
                  dist/revocations.json.sig)

          if gh release view "$TAG" >/dev/null 2>&1; then
            existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            missing=0
            for name in ProtonDrive-CLI-"${VERSION}"-GUI-"${GUI}"-x86_64.AppImage \
                        ProtonDrive-CLI-"${VERSION}"-GUI-"${GUI}"-aarch64.AppImage \
                        proton-drive_"${VERSION}"+gui"${GUI}"_amd64.deb \
                        proton-drive_"${VERSION}"+gui"${GUI}"_arm64.deb \
                        proton-drive_"${VERSION}"+gui"${GUI}"_x86_64.flatpak \
                        SHA256SUMS SHA256SUMS.sig revocations.json revocations.json.sig; do
              grep -qxF "$name" <<<"$existing" || missing=1
            done
            if [ "$missing" -eq 0 ] && [ "$FORCE" != "true" ]; then
              echo "Release $TAG already has every asset; nothing to upload."
              echo "Re-run with force_rebuild to replace them."
            else
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
              gh release edit "$TAG" --notes-file "$NOTES"
              echo "Refreshed assets and notes on $TAG."
            fi
          else
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "Proton Drive CLI ${VERSION} + GUI ${GUI} — AppImage, deb + Flatpak" \
              --notes-file "$NOTES" \
              "${ASSETS[@]}"
            echo "Created release $TAG."
          fi

      - name: Keep the built artifacts for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appimages-${{ steps.upstream.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.flatpak
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/revocations.json
            dist/revocations.json.sig
          if-no-files-found: error
          retention-days: 7
