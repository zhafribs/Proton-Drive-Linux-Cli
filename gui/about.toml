# Permissive licences cargo-about may select for multi-licensed crates: the
# Rust ecosystem's norm is "MIT OR Apache-2.0" (sometimes with Zlib, BSD or
# Unlicense added) - the permissive option is the one the shipped binary is
# under, matching the option Rust itself takes. Dual-licensed crates that
# also offer a GPL option (r-efi, self_cell) are therefore satisfied by
# their permissive option here, which is exactly what
# THIRD_PARTY_NOTICES.md states: no dependency puts the binary under a
# copyleft licence.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    # Font data embedded by egui's default fonts (epaint_default_fonts):
    # the font files, not the code, and their texts ship in the output.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]
