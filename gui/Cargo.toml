[package]
name = "proton-drive-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
fs2 = "0.4.3"
ksni = { version = "0.3.6", features = ["blocking"] }
notify-rust = "4.18.2"
png = "0.18.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
ureq = "3.4.2"
zbus = { version = "5.19.0", features = ["blocking-api"] }

# The binary ships inside the AppImage - size matters (this replaced a
# bundled Qt6 stack, the whole point being a smaller app).
[profile.release]
lto = true
codegen-units = 1
strip = true
